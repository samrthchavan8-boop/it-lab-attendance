<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Admin Dashboard - Attendance Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .refresh-btn {
            display: block;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .refresh-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>College Lab - Admin Attendance Dashboard</h2>
        <button class="refresh-btn" onclick="loadAttendance()">Refresh Records</button>
        
        <table>
            <thead>
                <tr>
                    <th>Record ID</th>
                    <th>Student ID</th>
                    <th>PC Number</th>
                    <th>Check-in Time</th>
                </tr>
            </thead>
            <tbody id="attendance-table-body">
                <!-- Records will load here dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        async function loadAttendance() {
            try {
                const response = await fetch('/api/attendance');
                const result = await response.json();
                
                const tableBody = document.getElementById('attendance-table-body');
                tableBody.innerHTML = '';

                if (result.success && result.data.length > 0) {
                    result.data.forEach(record => {
                        const row = `<tr>
                            <td>${record.id}</td>
                            <td>${record.studentId}</td>
                            <td>PC - ${record.pcNumber}</td>
                            <td>${record.time}</td>
                        </tr>`;
                        tableBody.innerHTML += row;
                    });
                } else {
                    tableBody.innerHTML = `<tr><td colspan="4">No check-ins recorded yet.</td></tr>`;
                }
            } catch (error) {
                console.error('Error fetching attendance:', error);
            }
        }

        // Load records automatically when the page opens
        loadAttendance();
    </script>

</body>
</html>
